name: Build/Release Electron App

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build (all, mac, linux, win, or comma-separated)'
        required: false
        default: all
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-release-compare:
    name: Schema vs last official release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      schema_bumped: ${{ steps.compare.outputs.schema_bumped }}
      curr_schema: ${{ steps.compare.outputs.curr_schema }}
      prev_schema: ${{ steps.compare.outputs.prev_schema }}
      prev_tag: ${{ steps.compare.outputs.prev_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Resolve release tag from package.json
        id: release_tag
        run: echo "value=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Compare schema to last published release
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: >
          node scripts/ci-schema-release-compare.mjs --release
          --write-readme READ-ME-FIRST-schema.md

      - name: Upload schema compare readme
        uses: actions/upload-artifact@v7
        with:
          name: READ-ME-FIRST-schema-${{ github.sha }}
          path: READ-ME-FIRST-schema.md
          retention-days: 30

  prepare-github-release:
    needs: schema-release-compare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.release_tag.outputs.value }}
      release_id: ${{ steps.ensure.outputs.release_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve release tag from package.json
        id: release_tag
        run: echo "value=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Sole job allowed to POST /releases (SARMESH_ALLOW_DRAFT_CREATE=1).
      - name: Ensure draft GitHub release exists
        id: ensure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
          SARMESH_ALLOW_DRAFT_CREATE: '1'
        run: node scripts/ci-ensure-github-draft-release.mjs

      # Rebuild schema note from compare-job outputs (not the downloaded artifact) so the
      # patch script never does file→HTTP (CodeQL js/file-access-to-http).
      - name: Patch draft release body with schema note
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
          RELEASE_ID: ${{ steps.ensure.outputs.release_id }}
          SARMESH_SCHEMA_CURR: ${{ needs.schema-release-compare.outputs.curr_schema }}
          SARMESH_SCHEMA_PREV: ${{ needs.schema-release-compare.outputs.prev_schema }}
          SARMESH_SCHEMA_PREV_TAG: ${{ needs.schema-release-compare.outputs.prev_tag }}
        run: node scripts/ci-patch-draft-release-schema-note.mjs

  resolve-release-matrix:
    needs: prepare-github-release
    if: ${{ !cancelled() && needs.prepare-github-release.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve release matrix
        id: matrix
        env:
          RELEASE_PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'all' }}
        run: echo "include=$(node scripts/resolve-release-matrix.mjs)" >> "$GITHUB_OUTPUT"

  release:
    needs: [schema-release-compare, prepare-github-release, resolve-release-matrix]
    if: ${{ !cancelled() && needs.prepare-github-release.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    permissions:
      contents: write
    strategy:
      # A platform that cannot build must not cancel the others — otherwise one
      # unsignable macOS job leaves the release with no assets at all.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve-release-matrix.outputs.include) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      # pnpm 12 native bootstrap: PowerShell prefers broken .bin/pnpm.ps1 (silent exit 0).
      - name: Prefer native pnpm.exe on Windows PATH
        if: runner.os == 'Windows'
        run: node scripts/ci-prefer-windows-pnpm-exe.mjs

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Verify pnpm
        run: node scripts/ci-verify-pnpm.mjs

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          bash scripts/ci-setup-linux-arm64-apt.sh
          sudo apt-get install -y \
            libudev-dev \
            rpm \
            libdbus-1-dev \
            libdbus-1-dev:arm64 \
            pkg-config \
            gcc-aarch64-linux-gnu

      - name: Validate Windows build runner
        if: contains(matrix.build_script, 'dist:win') && matrix.os != 'windows-latest'
        run: |
          echo "Windows build scripts must run on windows-latest."
          exit 1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native dependencies
        run: pnpm run rebuild

      - name: Write schema upgrade installer notice
        env:
          SARMESH_SCHEMA_BUMPED: ${{ needs.schema-release-compare.outputs.schema_bumped }}
          SARMESH_SCHEMA_CURR: ${{ needs.schema-release-compare.outputs.curr_schema }}
          SARMESH_SCHEMA_PREV: ${{ needs.schema-release-compare.outputs.prev_schema }}
          SARMESH_SCHEMA_PREV_TAG: ${{ needs.schema-release-compare.outputs.prev_tag }}
        run: node scripts/write-schema-upgrade-notice.mjs

      - name: Validate macOS signing secrets
        if: matrix.os == 'macos-latest' && github.event_name == 'release'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_LINK not set — skipping notarization secret validation (unsigned/fork build)."
            exit 0
          fi
          missing=""
          [ -z "$CSC_KEY_PASSWORD" ] && missing="$missing CSC_KEY_PASSWORD"
          [ -z "$APPLE_ID" ] && missing="$missing APPLE_ID"
          [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] && missing="$missing APPLE_APP_SPECIFIC_PASSWORD"
          [ -z "$APPLE_TEAM_ID" ] && missing="$missing APPLE_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "CSC_LINK is set but missing required notarization secrets:$missing"
            exit 1
          fi

      # Embeds buildChannel=release + tag + Actions runUrl into the main bundle (support exports / logs).
      - name: Stamp CI build info
        env:
          SARMESH_BUILD_CHANNEL: release
          SARMESH_BUILD_WORKFLOW: Build/Release Electron App
        run: node scripts/ci-write-build-info-env.mjs

      - name: Configure macOS code signing
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CSC_LINK_SECRET: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_SECRET: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$CSC_LINK_SECRET" ]; then
            {
              echo "CSC_LINK=$CSC_LINK_SECRET"
              echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_SECRET"
              echo "CSC_IDENTITY_AUTO_DISCOVERY=true"
            } >> "$GITHUB_ENV"
            echo "macOS signing certificate configured."
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "No CSC_LINK secret - building macOS UNSIGNED."
          fi

      - name: Build packages
        env:
          # macOS signing vars are exported by the step above, and only when a
          # certificate secret exists. Setting CSC_LINK to '' here made
          # electron-builder path-resolve the empty value to the workspace root
          # and fail importing a certificate this fork does not have.
          # ── macOS notarization ─────────────────────────────────────────────
          APPLE_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_TEAM_ID || '' }}
          # SARMesh does not ship the Reticulum sidecar: it needs a Rust toolchain
          # and overlay patches against a third-party crate, and upstream drift in
          # that crate blocked every release. The app reports the Reticulum stack
          # as unavailable at runtime instead of crashing.
          SARMESH_ALLOW_MISSING_SIDECAR: '1'
        # dist:* uses --publish never so electron-builder never POSTs a draft release.
        run: ${{ matrix.build_script }}

      - name: Assert Windows NSIS installers present
        if: matrix.os == 'windows-latest'
        run: node scripts/assert-win-setup-installers.mjs --root release

      - name: Upload assets to draft GitHub release
        if: >-
          ${{ needs.prepare-github-release.result == 'success'
          && needs.prepare-github-release.outputs.release_id != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-github-release.outputs.release_id }}
          UPLOAD_GLOBS: ${{ matrix.upload_globs }}
        # Attach only — never create a release (prepare owns POST /releases).
        # UPLOAD_GLOBS is an intentional space-separated glob list from the matrix.
        run: |
          # shellcheck disable=SC2086
          node scripts/ci-upload-release-assets.mjs $UPLOAD_GLOBS

      # Do not upload raw SARMesh.app — upload-artifact@v7 dereferences framework
      # symlinks (~3× Electron Framework size). DMG/ZIP preserve correct layout.
      - name: Upload macOS Artifact
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: sarmesh-macos-${{ github.sha }}
          path: |
            release/mac/**/*.dmg
            release/mac/**/*.zip
            release/mac-x64/**/*.dmg
            release/mac-x64/**/*.zip
            release/mac-arm64/**/*.dmg
            release/mac-arm64/**/*.zip
            release/mac-universal/**/*.dmg
            release/mac-universal/**/*.zip
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
          retention-days: 30

      - name: Upload Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: sarmesh-linux-${{ github.sha }}
          path: |
            release/*.AppImage
            release/*.rpm
            release/*.deb
            release/linux-unpacked/**/*
            release/linux/**/*.AppImage
            release/linux/**/*.rpm
            release/linux/**/*.deb
            release/latest-linux.yml
            release/latest-linux-arm64.yml
          retention-days: 30

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: sarmesh-windows-${{ github.sha }}
          path: |
            # Per-arch NSIS installers: SARMesh-Setup-{version}.exe + {version}-arm64.exe
            release/*.exe
            release/latest.yml
            release/win-unpacked/**/*
            release/win-arm64-unpacked/**/*
            release/win-x64-unpacked/**/*
          if-no-files-found: error
          retention-days: 30

  finalize-github-release:
    name: Consolidate draft release assets
    needs: [release, prepare-github-release]
    # Require a successful build matrix — skipped/cancelled release must not consolidate.
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Resolve release tag from package.json
        id: release_tag
        run: echo "value=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Consolidate duplicate draft releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
        run: node scripts/ci-ensure-github-draft-release.mjs

      - name: Verify draft release tag_name
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
          RELEASE_ID: ${{ needs.prepare-github-release.outputs.release_id }}
        run: node scripts/ci-verify-github-draft-release.mjs

      - name: Verify updater channel yml urls match GitHub assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PUSH_TOKEN: ${{ secrets.RELEASE_PUSH_TOKEN }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.value }}
          RELEASE_ID: ${{ needs.prepare-github-release.outputs.release_id }}
        run: node scripts/assert-github-release-update-yml.mjs

  packaging-smoke:
    name: Smoke test ${{ matrix.label }}
    needs: [release, finalize-github-release]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-latest
            label: macOS packaging
            artifact: sarmesh-macos-${{ github.sha }}
            smoke_run: >-
              node scripts/assert-update-yml-artifacts.mjs --require latest-mac.yml
              && node scripts/verify-mac-packaging.mjs
          - os: ubuntu-latest
            label: Linux packaging
            artifact: sarmesh-linux-${{ github.sha }}
            smoke_run: >-
              node scripts/assert-update-yml-artifacts.mjs --require latest-linux.yml
              --require latest-linux-arm64.yml && node scripts/verify-linux-packaging.mjs
          - os: windows-latest
            label: x64 NSIS install
            artifact: sarmesh-windows-${{ github.sha }}
            smoke_run: >-
              node scripts/assert-update-yml-artifacts.mjs --require latest.yml
              && node scripts/test-win-nsis-install.mjs --arch x64
          - os: windows-11-vs2026-arm
            label: arm64 NSIS install (WoA)
            artifact: sarmesh-windows-${{ github.sha }}
            smoke_run: >-
              node scripts/assert-update-yml-artifacts.mjs --require latest.yml
              && node scripts/test-win-nsis-install.mjs --arch arm64 --probe-7z
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          # Pin to workflow SHA — tag ref may move mid-run (e.g. recovery retag) and
          # actions/checkout@v6 fails integrity check against github.sha.
          ref: ${{ github.sha }}

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release

      - name: Install squashfs-tools (cross-arch AppImage extract)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools

      - name: Run packaging smoke test
        run: ${{ matrix.smoke_run }}

      - name: Upload Windows x64 install failure logs
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: sarmesh-win-x64-install-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sarmesh-install-x64.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Windows arm64 install failure logs
        if: failure() && matrix.os == 'windows-11-vs2026-arm'
        uses: actions/upload-artifact@v7
        with:
          name: sarmesh-win-arm64-install-logs-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sarmesh-install-arm64.log
            ${{ runner.temp }}/sarmesh-7z-probe/**
          if-no-files-found: ignore
          retention-days: 7
