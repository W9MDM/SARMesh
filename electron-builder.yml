appId: net.nwimesh.sarmesh
productName: SARMesh
protocols:
  - name: SARMesh LXMF
    schemes:
      - lxm
directories:
  buildResources: resources
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json
asarUnpack:
  - 'node_modules/systeminformation/**/*'
  - 'node_modules/@stoprocent/**/*'
# Native deps ship N-API prebuilds (@serialport/bindings-cpp, @stoprocent/noble),
# which are ABI-stable across Node and Electron, and scripts/rebuild-native.mjs
# already handles rebuilds at install time. Letting electron-builder run
# @electron/rebuild again is redundant and hard-fails on any machine without
# Visual Studio — or with a space in the project path.
npmRebuild: false

publish:
  provider: github
  owner: W9MDM
  repo: SARMesh
  # Keep GitHub Releases as drafts until a maintainer publishes manually.
  releaseType: draft
beforePack: scripts/electron-builder-before-pack.mjs
extraResources:
  - from: resources/icons/win/sarmesh.ico
    to: sarmesh.ico
  - from: resources/reticulum-sidecar
    to: reticulum-sidecar
    filter:
      - '**/*'
      # staged/ is the per-arch build output beforePack copies FROM. Without this
      # exclusion every installer also ships staged/<platform>-<arch>/ for every
      # arch built in the run — so a multi-arch build puts both architectures'
      # sidecars in each installer, on top of the correct one. Nothing reads
      # staged/ at runtime: the app and the bundle verifier both look only at
      # resources/reticulum-sidecar/<binary>.
      - '!staged/**'
  - from: resources/icons/linux/256x256.png
    to: 256x256.png
  - from: resources/icons/mac/macos-menubar-icon-Template/macos-menubar-icon-Template.png
    to: macos-menubar-icon-Template.png
  - from: resources/icons/mac/macos-menubar-icon-Template/macos-menubar-icon-Template@2x.png
    to: macos-menubar-icon-Template@2x.png
  - from: resources/icons/mac/macos-menubar-icon-Template/macos-menubar-icon-Template@3x.png
    to: macos-menubar-icon-Template@3x.png
mac:
  category: public.app-category.utilities
  # Electron 44 drops macOS 12 Monterey — Ventura (13) is the new floor.
  minimumSystemVersion: '13.0.0'
  # Hardened runtime improves tamper resistance; required for notarized distribution.
  hardenedRuntime: true
  preAutoEntitlements: true
  helperBundleId: net.nwimesh.sarmesh.helper
  extendInfo:
    NSBluetoothAlwaysUsageDescription: 'SARMesh needs Bluetooth to communicate with Meshtastic devices.'
    NSMicrophoneUsageDescription: 'SARMesh needs the microphone for Reticulum LXST voice calls.'
    NSCameraUsageDescription: 'SARMesh needs the camera to scan QR codes for channel and contact sharing.'
  target:
    - dmg
    - zip
  icon: resources/icons/mac/icon.icns
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.inherit.plist
  # Notarize after signing via Apple notarytool. Requires APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD, and APPLE_TEAM_ID env vars at build time.
  # Automatically skipped when code signing is skipped (no cert available).
  notarize: true
# Drag-to-install layout: app icon + Applications symlink + ZIP extract warning (Finder DMG window).
dmg:
  contents:
    - x: 130
      y: 220
      type: file
    - x: 410
      y: 220
      type: link
      path: /Applications
      name: Applications
    - x: 130
      y: 380
      type: file
      path: resources/macos/IMPORTANT-macOS-install.txt
      name: IMPORTANT-Read-Me.txt
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
  category: Utility
  icon: resources/icons/linux/
  desktop:
    entry:
      StartupWMClass: 'net.nwimesh.sarmesh'
      Categories: 'Utility;Network;'
  extraResources:
    - from: ./copyright
      to: usr/share/doc/sarmesh/copyright
deb:
rpm:
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  icon: resources/icons/win/sarmesh.ico
nsis:
  buildUniversalInstaller: false
  # WoA: Nsis7z cannot reliably extract ARM64 LZMA app-arm64.7z (main exe missing).
  useZip: true
  differentialPackage: false
  include: resources/installer.nsh
  # Do not set artifactName. ${archSuffix} is not an electron-builder macro, and
  # ${arch} would add -x64 to the x64 installer (latest.yml omits that suffix).
  # Default names contain spaces; normalize-win-setup-artifact-names.mjs
  # hyphenates them so disk == latest.yml == GitHub asset names.
